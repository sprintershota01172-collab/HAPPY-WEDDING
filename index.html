<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f5">
<meta name="description" content="ふたりで楽しく、結婚式の準備を。役割・予算・ゲストをまとめるウェディング管理アプリ。">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<div id="app">
 <header class="app-header">
  <div class="brand" role="heading" aria-level="1"><span class="brand-symbol">✿</span><span>Happy Wedding</span></div>
  <div class="header-actions"><span id="connection" class="connection">この端末に保存</span><button id="header-notifications" class="icon-button notification-bell" aria-label="変更通知" title="パートナーからの変更通知">♧</button><button id="header-settings" class="icon-button" aria-label="設定">⚙</button></div>
 </header>
 <main id="main" tabindex="-1" aria-live="polite"></main>
 <nav class="bottom-nav" aria-label="メインメニュー">
  <button data-tab="home" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span><span>ホーム</span></button>
  <button data-tab="tasks"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 2.5 2.5L16 9"/></svg></span><span>やること</span></button>
  <button data-tab="money"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg></span><span>お金</span></button>
  <button data-tab="guests"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6M17 14a5 5 0 0 1 4 5v1"/></svg></span><span>ゲスト</span></button>
  <button data-tab="presents" aria-label="お祝い・お返し"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 13h18M12 9v12M12 9H8.5C4 9 4.5 3 8 3c2.5 0 4 4.5 4 6Zm0 0h3.5c4.5 0 4-6 .5-6C13.5 3 12 7.5 12 9Z"/></svg></span><span>お祝い</span></button>
  <button data-tab="more"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M8 12h8M12 8v8"/></svg></span><span>その他</span></button>
 </nav>
</div>
<dialog id="modal"><div id="modal-content"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="confetti" aria-hidden="true"></div>
<script type="module" src="./app.js?v=20261020r8"></script>

</html>
