<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5e9e5">
<meta name="description" content="ふたりで楽しく、結婚式の準備を。役割・予算・ゲストをまとめるウェディング管理アプリ。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Happy Wedding">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="./styles.css">
<title>Happy Wedding — ふたりの結婚式準備</title>
</head>
<body>
<div id="app">
 <header class="app-header">
  <div class="brand" role="heading" aria-level="1"><span class="brand-symbol">✿</span><span>Happy Wedding</span></div>
  <div class="header-actions"><span id="connection" class="connection">この端末に保存</span><button id="header-settings" class="icon-button" aria-label="設定">⚙</button></div>
 </header>
 <main id="main" tabindex="-1" aria-live="polite"></main>
 <nav class="bottom-nav" aria-label="メインメニュー">
  <button data-tab="home" class="active"><span class="nav-icon">⌂</span><span>ホーム</span></button>
  <button data-tab="tasks"><span class="nav-icon">☑</span><span>やること</span></button>
  <button data-tab="money"><span class="nav-icon">¥</span><span>お金</span></button>
  <button data-tab="guests"><span class="nav-icon">♧</span><span>ゲスト</span></button>
  <button data-tab="more"><span class="nav-icon">☷</span><span>その他</span></button>
 </nav>
</div>
<dialog id="modal"><div id="modal-content"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="confetti" aria-hidden="true"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
